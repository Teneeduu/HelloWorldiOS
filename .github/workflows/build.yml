name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app && xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/HelloWorld.app Payload/
          zip -r HelloWorld-unsigned.ipa Payload

      - name: Write AltStore source manifest
        run: python3 scripts/make_altstore_source.py "${{ github.run_number }}" HelloWorld-unsigned.ipa source.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-unsigned-ipa
          path: HelloWorld-unsigned.ipa

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" HelloWorld-unsigned.ipa source.json \
            --title "HelloWorld build ${{ github.run_number }}" \
            --notes "未签名 ipa，用 AltStore / Sideloadly 自签后安装。commit: ${{ github.sha }}" \
            --latest

  simulator-screenshot:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for simulator
        run: |
          xcodebuild \
            -project HelloWorld.xcodeproj \
            -scheme HelloWorld \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            -destination "generic/platform=iOS Simulator" \
            build

      - name: Make sample photos and a sample plan
        run: |
          python3 scripts/make_sample_photos.py
          python3 scripts/make_sample_plan.py

      - name: Boot simulator, install app, take screenshot
        run: |
          DEVICE_ID=$(xcrun simctl create "Jo-Preview" "iPhone 16")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/Build/Products/Debug-iphonesimulator/HelloWorld.app
          # Drop sample images straight into the app's own Photos folder, which
          # needs no photo library permission.
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.example.helloworld data)
          mkdir -p "$APP_DATA/Documents/Photos"
          cp sample1.png sample2.png sample3.png "$APP_DATA/Documents/Photos/"
          cp sample-plan.json "$APP_DATA/Documents/plan.json"
          xcrun simctl launch "$DEVICE_ID" com.example.helloworld
          sleep 8
          xcrun simctl io "$DEVICE_ID" screenshot screenshot.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-simulator-screenshot
          path: screenshot.png
